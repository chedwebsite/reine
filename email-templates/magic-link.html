<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your sign-in link</title>
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" style="max-width:520px;background-color:#141414;border:1px solid #2a2a2a;border-radius:6px;font-family:Arial,Helvetica,sans-serif;">
          <tr>
            <td align="center" style="padding:40px 32px 8px;">
              <p style="margin:0;font-size:26px;font-weight:bold;letter-spacing:6px;color:#c9a84c;">REINE LUXE</p>
              <p style="margin:8px 0 0;font-size:11px;letter-spacing:3px;color:#8a8478;">CO. &middot; LUXURY FASHION</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 32px 8px;">
              <h1 style="margin:0 0 12px;font-size:22px;color:#ffffff;">Your sign-in link</h1>
              <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#d0cbc2;">
                Click the button below to sign in to your Reine Luxe account securely.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 32px 24px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#c9a84c;color:#0a0a0a;text-decoration:none;font-size:14px;font-weight:bold;letter-spacing:1px;padding:14px 36px;border-radius:4px;">
                Sign In
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 24px;">
              <p style="margin:0;font-size:13px;line-height:1.6;color:#d0cbc2;">
                This link is single-use and expires shortly. If you didn't request it, you
                can safely ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;border-top:1px solid #2a2a2a;">
              <p style="margin:0;font-size:12px;color:#8a8478;">
                Need help? Contact <a href="mailto:support@reineluxe.com" style="color:#c9a84c;text-decoration:none;">support@reineluxe.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
